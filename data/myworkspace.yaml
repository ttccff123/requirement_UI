# 我的空间页面期望文案与测试数据
page:
  title: "我的空间"
  url: "/#/home"

# 模块标题
modules:
  - 任务总览
  - 项目总览
  - 参考样例
  - 我的任务
  - 我的项目
  - 动态
  - 工具集

# 按钮点击 & 预期跳转/提示
# type: navigation = 点击后 URL 变化 | dialog = 弹窗 | toast = 消息提示 | in_page = 页面内变化
buttons:
  - button: 查看任务
    module: 任务总览
    type: navigation
    expected: "点击后跳转到任务列表页"

  - button: 查看项目
    module: 项目总览
    type: navigation
    expected: "点击后跳转到项目列表页"

  - button: 处理任务
    module: 我的任务
    type: navigation
    expected: "点击后跳转到任务详情页"

  - button: 处理项目
    module: 我的项目
    type: navigation
    expected: "点击后跳转到项目详情页"

# 关于弹窗
about_dialog:
  title: "关于"

# 右下角图标
corner_icons:
  - name: 编辑布局
    icon: icon-shitu
    type: navigation
  - name: 提示
    icon: icon-tishi
    type: dialog
  - name: 帮助/关于
    icon: icon-bangzhu
    type: dialog
