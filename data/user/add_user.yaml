# 新增用户 — 表单字段校验测试数据
#
# 字段说明：
#   case        : 用例名称
#   type        : smoke=冒烟测试 | system=系统测试 | core=核心测试
#   category    : 必填校验 | 字符类型 | 字符长度 | 重复账号 | 综合填充
#   field       : 要操作的字段 label（用户名 / 姓名 / 密码 / 联系电话 / 邮箱 等）
#   value       : 填入的值
#   expected    : error=应触发校验错误 | may_pass=可能通过校验
#   message     : 可选，期望的错误提示关键词（部分匹配）
#   fill_others : 可选，是否在测试前填充其他字段（true=先填其他字段再操作目标字段）

# 成功创建用户时填入的默认值
success_fill:
  用户名: "<UNIQUE>"       # 运行时替换为唯一用户名
  姓名: "自动化测试"
  角色: ""                  # 空值 → 选择第一个可用选项
  部门: ""                  # 空值 → 选择第一个可用选项
  联系电话: "13800138000"
  邮箱: "test@example.com"

cases:
  # ---- 必填项为空 ----
  - case: 新增用户-用户名为空
    type: smoke
    category: 必填校验
    field: 用户名
    value: ""
    expected: error
    message: 请输入

  - case: 新增用户-姓名为空
    type: smoke
    category: 必填校验
    field: 姓名
    value: ""
    expected: error
    message: 请输入

  - case: 新增用户-角色为空
    type: smoke
    category: 必填校验
    field: 角色
    value: ""
    expected: error
    message: 请选择

  # ---- 字符类型 ----
  - case: 新增用户-用户名含特殊字符
    type: system
    category: 字符类型
    field: 用户名
    value: "!@#$%^&*()"
    expected: error

  - case: 新增用户-用户名含中文字符
    type: system
    category: 字符类型
    field: 用户名
    value: "中文用户名"
    expected: error

  - case: 新增用户-用户名为纯空格
    type: system
    category: 字符类型
    field: 用户名
    value: "     "
    expected: error

  - case: 新增用户-用户名含SQL注入字符
    type: system
    category: 字符类型
    field: 用户名
    value: "'; DROP TABLE users; --"
    expected: error

  - case: 新增用户-用户名含XSS脚本
    type: system
    category: 字符类型
    field: 用户名
    value: "<script>alert(1)</script>"
    expected: error

  - case: 新增用户-联系电话含字母
    type: system
    category: 字符类型
    field: 联系电话
    value: "1380013abcd"
    expected: error

  - case: 新增用户-邮箱格式错误
    type: system
    category: 字符类型
    field: 邮箱
    value: "not-an-email"
    expected: error

  - case: 新增用户-姓名为纯数字(不符合)
    type: system
    category: 字符类型
    field: 姓名
    value: "12345"
    expected: error

  # ---- 用户名格式：只支持英文和数字 ----
  - case: 新增用户-用户名纯英文(符合)
    type: system
    category: 字符类型
    field: 用户名
    value: "<RANDOM_ALPHA>"
    expected: may_pass

  - case: 新增用户-用户名英文数字混合(符合)
    type: system
    category: 字符类型
    field: 用户名
    value: "<RANDOM_ALPHANUM>"
    expected: may_pass

  - case: 新增用户-用户名为纯数字(符合)
    type: system
    category: 字符类型
    field: 用户名
    value: "<RANDOM_DIGIT>"
    expected: may_pass

  # ---- 姓名格式：只支持中英文 ----
  - case: 新增用户-姓名纯中文(符合)
    type: system
    category: 字符类型
    field: 姓名
    value: "张三"
    expected: may_pass

  - case: 新增用户-姓名纯英文(符合)
    type: system
    category: 字符类型
    field: 姓名
    value: "JohnDoe"
    expected: may_pass

  - case: 新增用户-姓名中英混合(符合)
    type: system
    category: 字符类型
    field: 姓名
    value: "张San"
    expected: may_pass

  - case: 新增用户-姓名含特殊字符(不符合)
    type: system
    category: 字符类型
    field: 姓名
    value: "张@三"
    expected: error

  # ---- 联系电话格式校验：11位中国大陆联系电话 ----
  - case: 新增用户-联系电话标准格式(符合)
    type: system
    category: 字符类型
    field: 联系电话
    value: "13800138000"
    expected: may_pass

  - case: 新增用户-联系电话非1开头(不符合)
    type: system
    category: 字符类型
    field: 联系电话
    value: "23800138000"
    expected: error

  - case: 新增用户-联系电话含横线(不符合)
    type: system
    category: 字符类型
    field: 联系电话
    value: "138-0013-8000"
    expected: error

  - case: 新增用户-联系电话位数不足(不符合)
    type: system
    category: 字符类型
    field: 联系电话
    value: "1380013800"
    expected: error

  # ---- 邮箱格式校验 ----
  - case: 新增用户-邮箱标准格式(符合)
    type: system
    category: 字符类型
    field: 邮箱
    value: "test@example.com"
    expected: may_pass

  - case: 新增用户-邮箱缺@符号(不符合)
    type: system
    category: 字符类型
    field: 邮箱
    value: "testexample.com"
    expected: error

  - case: 新增用户-邮箱缺域名(不符合)
    type: system
    category: 字符类型
    field: 邮箱
    value: "test@"
    expected: error

  # ---- 角色下拉（多选） ----
  - case: 新增用户-角色选择一个(符合)
    type: system
    category: 字符类型
    field: 角色
    value: "管理员"
    expected: may_pass

  - case: 新增用户-角色选择全部(符合)
    type: system
    category: 字符类型
    field: 角色
    value: "<ALL>"
    expected: may_pass

  # ---- 字符长度（用户名/姓名：1-30字符） ----
  - case: 新增用户-用户名最短(1字符)
    type: system
    category: 字符长度
    field: 用户名
    value: "<RANDOM_ALPHA_1>"
    expected: may_pass

  - case: 新增用户-用户名边界值(30字符)
    type: system
    category: 字符长度
    field: 用户名
    value: "<RANDOM_ALPHA_30>"
    expected: may_pass

  - case: 新增用户-用户名超长(31字符)
    type: system
    category: 字符长度
    field: 用户名
    value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expected: error

  - case: 新增用户-姓名最短(1字符)
    type: system
    category: 字符长度
    field: 姓名
    value: "张"
    expected: may_pass

  - case: 新增用户-姓名边界值(30字符)
    type: system
    category: 字符长度
    field: 姓名
    value: "abcdefghijklmnopqrstuvwxyzabcd"
    expected: may_pass

  - case: 新增用户-姓名超长(31字符)
    type: system
    category: 字符长度
    field: 姓名
    value: "abcdefghijklmnopqrstuvwxyzabcde"
    expected: error

  - case: 新增用户-联系电话过短(5位)
    type: system
    category: 字符长度
    field: 联系电话
    value: "12345"
    expected: error

  - case: 新增用户-联系电话过长(20位)
    type: system
    category: 字符长度
    field: 联系电话
    value: "12345678901234567890"
    expected: error

  # ---- 重复账号 ----
  - case: 新增用户-用户名重复(已有账号)
    type: core
    category: 重复账号
    field: 用户名
    value: "<EXISTING>"
    expected: error
    message: 已存在
