# 编辑用户 — 表单字段校验测试数据
#
# 字段说明：
#   case        : 用例名称
#   type        : smoke=冒烟测试 | system=系统测试 | core=核心测试
#   category    : 弹窗校验 | 必填校验 | 字符类型 | 字符长度 | 重复账号
#   field       : 要操作的字段 label（用户名 / 姓名 / 联系电话 / 邮箱 等）
#   value       : 填入的值
#   expected    : error=应触发校验错误 | may_pass=可能通过校验
#   message     : 可选，期望的错误提示关键词（部分匹配）

cases:
  # ---- 弹窗校验 ----
  - case: 编辑用户-弹窗标题
    type: smoke
    category: 弹窗校验
    field: ""
    value: ""
    expected: may_pass

  - case: 编辑用户-默认值回填
    type: smoke
    category: 弹窗校验
    field: ""
    value: ""
    expected: may_pass

  - case: 编辑用户-取消按钮关闭弹窗
    type: smoke
    category: 弹窗校验
    field: ""
    value: ""
    expected: may_pass

  - case: 编辑用户-关闭按钮关闭弹窗
    type: smoke
    category: 弹窗校验
    field: ""
    value: ""
    expected: may_pass

  - case: 编辑用户-确定按钮保存成功
    type: smoke
    category: 弹窗校验
    field: ""
    value: ""
    expected: may_pass

  # ---- 必填校验 ----
  - case: 编辑用户-姓名为空
    type: smoke
    category: 必填校验
    field: 姓名
    value: ""
    expected: error
    message: 请输入

  - case: 编辑用户-角色为空
    type: smoke
    category: 必填校验
    field: 角色
    value: ""
    expected: error
    message: 请选择
