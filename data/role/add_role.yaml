# 新增角色 — 表单字段校验测试数据
#
# 字段说明：
#   case        : 用例名称
#   category    : 必填校验 | 字符类型 | 字符长度 | 重复名称
#   field       : 角色名称 / 角色描述
#   value       : 填入的值
#   expected    : error=应触发校验错误 | may_pass=可能通过校验
#   message     : 可选，期望的错误提示关键词

cases:
  # ---- 必填校验 ----
  - case: 新增角色-名称为空
    type: smoke
    category: 必填校验
    field: 角色名称
    value: ""
    expected: error
    message: 请输入

  # ---- 字符类型 ----
  - case: 新增角色-名称含特殊字符
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_SPECIAL>"
    expected: may_pass

  - case: 新增角色-名称含中文字符(符合)
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_CN>"
    expected: may_pass

  - case: 新增角色-名称纯英文(符合)
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_ALPHA>"
    expected: may_pass

  - case: 新增角色-名称英文数字混合(符合)
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_ALPHANUM>"
    expected: may_pass

  # ---- 字符长度 ----
  - case: 新增角色-名称最短(1字符)
    type: system
    category: 字符长度
    field: 角色名称
    value: "<RANDOM_ALPHA_1>"
    expected: may_pass

  - case: 新增角色-名称边界值(32字符)
    type: system
    category: 字符长度
    field: 角色名称
    value: "<RANDOM_ALPHA_32>"
    expected: may_pass

  - case: 新增角色-名称超长(33字符)
    type: system
    category: 字符长度
    field: 角色名称
    value: "<RANDOM_ALPHA_33>"
    expected: may_pass

  # ---- 名称空格 ----
  - case: 新增角色-名称前空格
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_LEAD_SPACE>"
    expected: may_pass

  - case: 新增角色-名称中间空格
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_MID_SPACE>"
    expected: may_pass

  - case: 新增角色-名称后空格
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_TAIL_SPACE>"
    expected: may_pass

  # ---- 名称安全攻击 ----
  - case: 新增角色-名称SQL注入
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_SQL>"
    expected: may_pass

  - case: 新增角色-名称JavaScript
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_SCRIPT>"
    expected: may_pass

  - case: 新增角色-名称XSS攻击
    type: system
    category: 字符类型
    field: 角色名称
    value: "<RANDOM_IMG>"
    expected: may_pass

  # ---- 角色描述长度 ----
  - case: 新增角色-描述为空(0字符)
    type: system
    category: 字符长度
    field: 角色描述
    value: ""
    expected: may_pass

  - case: 新增角色-描述含换行(符合)
    type: system
    category: 字符类型
    field: 角色描述
    value: "第一行\n第二行"
    expected: may_pass

  - case: 新增角色-描述含空格(符合)
    type: system
    category: 字符类型
    field: 角色描述
    value: "描 述 含 空 格"
    expected: may_pass

  - case: 新增角色-描述边界值(100字符)
    type: system
    category: 字符长度
    field: 角色描述
    value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expected: may_pass

  # ---- 重复名称 ----
  - case: 新增角色-名称重复
    type: core
    category: 重复名称
    field: 角色名称
    value: "<EXISTING>"
    expected: error
